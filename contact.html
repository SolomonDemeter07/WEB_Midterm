<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | WH40K Guide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-navbar">
            <div class="container-fluid px-4">
                <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
                    <img src="images/Aquila.jpg" alt="Aquila Logo" height="30" class="me-2"> 
                    WH40K GUIDE
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="tabletop.html">Tabletop</a></li>
                        <li class="nav-item"><a class="nav-link" href="lore.html">Lore & Books</a></li>
                        <li class="nav-item"><a class="nav-link" href="games.html">Video Games</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-5 pt-5 mb-5">
        <section class="text-center mb-5">
            <h1 class="display-4 fw-bold text-white mb-4">Join the Ranks</h1>
            <p class="lead text-white">
                Ready to pledge your allegiance? Contact your local tabletop club, subscribe to our grimdark newsletter, or send a transmission directly to the Inquisition. The Emperor protect.
            </p>
        </section>

        <section class="row justify-content-center">
            <div class="col-lg-6">
                <div class="contact-form-container">
                    <form action="#" method="POST">
                        
                        <div class="mb-3">
                            <label for="userName" class="form-label text-warning">Full Name / Designation</label>
                            <input type="text" class="form-control custom-input" id="userName" placeholder="Enter your name" required>
                        </div>

                        <div class="mb-3">
                            <label for="userEmail" class="form-label text-warning">Astropathic Relay (Email)</label>
                            <input type="email" class="form-control custom-input" id="userEmail" placeholder="Enter your email" required>
                        </div>

                        <div class="mb-3">
                            <label for="factionSelect" class="form-label text-warning">Choose Your Allegiance</label>
                            <select class="form-select custom-input" id="factionSelect" required>
                                <option value="" selected disabled>Select a faction...</option>
                                <option value="imperium">Imperium of Man</option>
                                <option value="chaos">Forces of Chaos</option>
                                <option value="xenos">Xenos (Orks, Tyranids, Eldar, etc.)</option>
                                <option value="undecided">I need more guidance</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="userMessage" class="form-label text-warning">Transmission Content</label>
                            <textarea class="form-control custom-input" id="userMessage" rows="5" placeholder="Write your message here..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 fw-bold fs-5">SEND TRANSMISSION</button>

                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
